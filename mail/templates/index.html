<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail VN - Email tạm thời</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.1"></script>
    <style>
        .mail-item { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 12px; background: #f9f9f9; }
        .mail-header { margin-bottom: 8px; }
        pre { white-space: pre-wrap; font-family: inherit; }
    </style>
</head>
<body class="bg-light">

<div class="container my-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">✉️ Temp Mail - Email tạm thời miễn phí</h4>
        </div>
        <div class="card-body">

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% else %}
            <div class="alert alert-info">
                <strong>Email của bạn:</strong><br>
                <code style="font-size:1.2rem;">{{ email }}</code><br><br>
                <strong>Mật khẩu:</strong> <code>{{ password }}</code> (thường không cần nhập)<br>
                <small>Tạo lúc: {{ created }}</small>
            </div>

            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-outline-primary" 
                        onclick="navigator.clipboard.writeText('{{ email }}'); alert('Đã copy!')">
                    📋 Copy email
                </button>
                <a href="/new" class="btn btn-outline-danger">🗑 Tạo mail mới</a>
            </div>

            <h5>Hộp thư đến (tự động cập nhật mỗi ~10s)</h5>
            <div id="mailbox"
                 hx-get="/messages"
                 hx-trigger="every 8s"
                 hx-swap="innerHTML">
                Đang tải hộp thư...
            </div>
            {% endif %}

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
